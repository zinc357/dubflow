<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DubFlow</title>
<style>
* { box-sizing: border-box; margin: 0; }
body { font-family: system-ui; max-width: 900px; margin: 0 auto; padding: 24px; background: #f5f5f5; color: #333; }
h2 { margin: 20px 0 8px; color: #333; }
.panel { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.row { display: flex; gap: 8; flex-wrap: wrap; align-items: center; margin-bottom: 8; }
input, select { padding: 6 10; border: 1px solid #ccc; border-radius: 4; font-size: 14; }
input[type="text"] { flex: 1; min-width: 200; }
button { padding: 6 16; border: none; border-radius: 4; background: #4f8cff; color: #fff; cursor: pointer; font-size: 14; }
button:disabled { opacity: .5; }
.job { border-bottom: 1px solid #eee; padding: 8 0; }
.steps { display: flex; gap: 4; flex-wrap: wrap; margin: 4 0; }
.step { padding: 2 8; border-radius: 4; font-size: 12; }
.badge { padding: 3 10; border-radius: 20; font-size: 12; }
.ok { background: #d4edda; color: #155724; }
.err { background: #f8d7da; color: #721c24; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 4 8; border-bottom: 1px solid #eee; font-size: 13; }
.muted { color: #999; font-size: 13; }
</style>
</head>
<body>
<h1>DubFlow 视频翻译</h1>
<p>流水线：导入 → 提取音频 → 语音识别 → 翻译 → 导出 SRT</p>

<h2>新建任务</h2>
<div class="panel">
  <div class="row"><input id="vp" style="width:100%" placeholder="视频绝对路径"></div>
  <div class="row" style="margin-top:8">
    <label>源语言</label>
    <select id="sl"><option value="">自动检测</option><option>en</option><option>zh</option><option>ja</option></select>
    <label>目标语言</label><input id="tl" value="zh" style="width:50">
    <label>运算设备</label>
    <select id="dev"><option value="auto">自动</option><option value="gpu">GPU</option><option value="cpu">CPU</option></select>
    <label>模型大小</label>
    <select id="sz"><option>tiny</option><option>base</option><option>small</option><option>medium</option><option>large-v3</option><option>large-v3-turbo</option><option>ggml-tiny</option><option>ggml-base</option><option>ggml-small</option><option>ggml-medium</option><option>ggml-large-v3-turbo-q5_0</option></select>
  </div>
  <div class="row" style="margin-top:8">
    <label><input type="checkbox" id="tr"> 翻译</label>
    <select id="tp"><option value="google">谷歌</option><option value="llm">LLM</option><option value="microsoft">微软</option></select>
  </div>
  <div style="margin-top:12"><button onclick="startJob()">开始处理</button> <span id="err" style="color:red"></span></div>
</div>

<h2>任务列表</h2>
<div class="panel"><div id="jobs"><p class="muted">加载中...</p></div></div>

<script>
const E = location.origin;
async function api(method, path, body) {
  const r = await fetch(E + path, {
    method, headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  return r.json();
}
async function refresh() {
  try {
    const h = await api("GET", "/health");
    document.getElementById("hb").textContent = "引擎已连接 · " + h.backend.name + "/" + h.backend.device;
    document.getElementById("hb").className = "badge ok";
    const d = await api("GET", "/jobs");
    render(d.jobs);
  } catch (e) {
    document.getElementById("hb").textContent = "引擎未连接";
    document.getElementById("hb").className = "badge err";
  }
}
function render(jobs) {
  const el = document.getElementById("jobs");
  el.innerHTML = jobs.length === 0 ? '<p class="muted">暂无任务</p>' : jobs.map(j => {
    const steps = Object.entries(j.steps).map(([k, s]) =>
      '<span class="step" style="padding:2 8;border-radius:4;font-size:12;background:' +
      (s.status === 'done' ? '#d4edda' : s.status === 'running' ? '#cce5ff' : s.status === 'failed' ? '#f8d7da' : '#eee') +
      '">' + k + ':' + s.status + (s.status === 'running' ? ' ' + Math.round(s.progress * 100) + '%' : '') + '</span>'
    ).join(' ');
    const pct = Object.values(j.steps).filter(s => s.status === 'done' || s.status === 'skipped').length / Object.keys(j.steps).length * 100;
    return '<div class="job" style="border-bottom:1px solid #eee;padding:8 0">' +
      '<div style="font-weight:600">' + j.video_path + ' <small style="color:#999">#' + j.id + '</small></div>' +
      '<div style="margin:4 0">' + steps + '</div>' +
      '<div style="background:#eee;border-radius:4;height:6;margin-top:4"><div style="width:' + pct + '%;background:#4f8cff;border-radius:4;height:100%"></div></div>' +
      (j.error ? '<p style="color:red;font-size:12">' + j.error + '</p>' : '') +
      '</div>';
  }).join('');
}
async function startJob() {
  const vp = document.getElementById("vp").value;
  const sz = document.getElementById("sz").value;
  const dev = document.getElementById("dev").value;
  const tr = document.getElementById("tr").checked;
  const tp = document.getElementById("tp").value;
  const body = {
    video_path: vp,
    asr: { provider: "auto", device: dev, model: sz },
    translation: { enabled: tr, provider: tp },
    export: { variant: "bilingual", save_to_video_folder: true, embed_video: false },
  };
  await fetch(E + "/jobs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  refresh();
}
setInterval(refresh, 2000);
refresh();
</script>
</body>
</html>
