[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dubflow-engine"
version = "0.1.1"
description = "DubFlow video translation engine - FastAPI + GPU ASR/translate pipeline"
readme = "../README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "zinc" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "faster-whisper>=1.0",
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
nvidia = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12"]
dev = ["pyinstaller>=6.0", "pytest>=8.0"]

[tool.setuptools]
packages = ["dubflow", "dubflow.asr"]
