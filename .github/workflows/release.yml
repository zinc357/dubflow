name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            mlx: true
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            mlx: false
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            mlx: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine deps
        working-directory: engine
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pyinstaller

      - name: Install NVIDIA runtime wheels
        if: runner.os != 'macOS'
        working-directory: engine
        run: pip install nvidia-cublas-cu12 nvidia-cudnn-cu12 || true

      - name: Package engine (PyInstaller)
        working-directory: engine
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ matrix.mlx }}" = "true" ]; then
            EXTRA="--collect-all mlx --collect-all mlx_whisper"
          fi
          pyinstaller --name dubflow-engine --onefile \
            --collect-all uvicorn \
            $EXTRA \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan.on \
            run_engine.py

      - name: Smoke test engine binary
        working-directory: engine
        shell: bash
        run: |
          BIN="dist/dubflow-engine"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="dist/dubflow-engine.exe"; fi
          DUBFLOW_PORT=8799 "$BIN" > engine-smoke.log 2>&1 &
          ENGINE_PID=$!
          OK=0
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8799/health > /dev/null 2>&1; then OK=1; break; fi
            sleep 1
          done
          if [ "$OK" != "1" ]; then
            echo "ENGINE SMOKE TEST FAILED:"; tail -30 engine-smoke.log
            exit 1
          fi
          curl -s http://127.0.0.1:8799/health
          kill $ENGINE_PID 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: engine/dist/dubflow-engine*

  whispercpp:
    runs-on: windows-2022
    env:
      VULKAN_VERSION: 1.4.357.0
    steps:
      - name: Install Vulkan SDK (silent)
        shell: pwsh
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp

      - name: Build whisper-cli (Vulkan, static)
        shell: pwsh
        run: |
          cmake -S . -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_VULKAN=ON `
            -DWHISPER_BUILD_TESTS=OFF `
            -DWHISPER_BUILD_EXAMPLES=OFF `
            -DBUILD_SHARED_LIBS=OFF
          cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Recurse -Filter whisper-cli.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "node_modules" } | Select-Object -First 1
          if (-not $exe) {
            Write-Host "== whisper-cli.exe NOT found; all exe files: =="
            Get-ChildItem -Path . -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 30 | ForEach-Object { Write-Host $_.FullName }
            throw "whisper-cli.exe not found"
          }
          Write-Host "found: $($exe.FullName)"
          Compress-Archive -Path $exe.FullName -DestinationPath whispercpp-vulkan-win32-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: whispercpp-vulkan-win32-x86_64
          path: whispercpp-vulkan-win32-x86_64.zip

  gui:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: engine-dist

      - name: Place engine sidecar
        shell: bash
        run: |
          mkdir -p gui/src-tauri/binaries
          EXT=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=".exe"; fi
          SIDECAR="gui/src-tauri/binaries/dubflow-engine-${{ matrix.target }}${EXT}"
          FOUND=$(find engine-dist -type f -name "dubflow-engine*" | head -1)
          if [ -n "$FOUND" ]; then
            cp "$FOUND" "$SIDECAR"
          else
            printf '#!/bin/sh\necho dubflow engine placeholder\n' > "$SIDECAR"
            chmod +x "$SIDECAR" || true
          fi
          ls -la gui/src-tauri/binaries || true

      - name: Install Linux system deps (tauri v2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Build GUI (vite + tauri)
        working-directory: gui
        run: |
          npm install
          npm run build
          npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.target }}
          path: gui/src-tauri/target/release/bundle/**

  publish:
    needs: [engine, gui, whispercpp]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: whispercpp-vulkan-win32-x86_64
          path: dist

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p release
          find dist -type f \
            \( -name "*.dmg" -o -name "*-setup.exe" -o -name "*.msi" \
               -o -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" \
               -o -name "whispercpp-*.zip" \) \
            -exec cp {} release/ \;
          ls -la release
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "DubFlow $GITHUB_REF_NAME" \
            --generate-notes \
            release/* || gh release upload "$GITHUB_REF_NAME" release/* --clobber
          gh release view "$GITHUB_REF_NAME" --json url,assets
