name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            mlx: true
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            mlx: false
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            mlx: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine deps
        working-directory: engine
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pyinstaller

      - name: Install NVIDIA runtime wheels
        if: runner.os != 'macOS'
        working-directory: engine
        run: pip install nvidia-cublas-cu12 nvidia-cudnn-cu12 || true

      - name: Package engine (PyInstaller)
        working-directory: engine
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ matrix.mlx }}" = "true" ]; then
            EXTRA="--collect-all mlx --collect-all mlx_whisper"
          fi
          pyinstaller --name dubflow-engine --onefile \
            --collect-all uvicorn \
            $EXTRA \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan.on \
            run_engine.py

      - name: Bundle ffmpeg/ffprobe (static per-OS)
        shell: bash
        run: |
          mkdir -p engine/dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            curl -sL --retry 3 -o ff9.zip https://www.osxexperts.net/ffmpeg9arm.zip
            curl -sL --retry 3 -o fp9.zip https://www.osxexperts.net/ffprobe9arm.zip
            unzip -o -j ff9.zip -d ffd; unzip -o -j fp9.zip -d fpd
            cp ffd/ffmpeg  engine/dist/ffmpeg-darwin-arm64
            cp fpd/ffprobe engine/dist/ffprobe-darwin-arm64
          elif [ "$RUNNER_OS" = "Linux" ]; then
            curl -sL --retry 3 -o ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xJf ff.tar.xz
            cp ffmpeg-*-static/ffmpeg  engine/dist/ffmpeg-linux-x86_64
            cp ffmpeg-*-static/ffprobe engine/dist/ffprobe-linux-x86_64
          else
            curl -sL --retry 3 -o ff.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
            unzip -o -q ff.zip -d ffz
            find ffz -type f -name ffmpeg.exe  -exec cp {} engine/dist/ffmpeg-win32-x86_64.exe \;
            find ffz -type f -name ffprobe.exe -exec cp {} engine/dist/ffprobe-win32-x86_64.exe \;
          fi
          chmod +x engine/dist/ffmpeg-* engine/dist/ffprobe-* 2>/dev/null || true
          ls -la engine/dist/

      - name: Smoke test engine binary
        working-directory: engine
        shell: bash
        run: |
          BIN="dist/dubflow-engine"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="dist/dubflow-engine.exe"; fi
          DUBFLOW_PORT=8799 "$BIN" > engine-smoke.log 2>&1 &
          ENGINE_PID=$!
          OK=0
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8799/health > /dev/null 2>&1; then OK=1; break; fi
            sleep 1
          done
          if [ "$OK" != "1" ]; then
            echo "ENGINE SMOKE TEST FAILED:"; tail -30 engine-smoke.log
            exit 1
          fi
          curl -s http://127.0.0.1:8799/health
          kill $ENGINE_PID 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: |
            engine/dist/dubflow-engine*
            engine/dist/ffmpeg-*
            engine/dist/ffprobe-*

  whispercpp:
    runs-on: ubuntu-latest
    steps:
      - name: Download prebuilt whisper.cpp Vulkan (DomoticX build)
        shell: bash
        run: |
          mkdir -p artifact
          curl -sL --retry 3 \
            -o artifact/whispercpp-vulkan-win32-x86_64.zip \
            "https://github.com/DomoticX/whisper.cpp-windows-vulkan/releases/download/v1.0/whisper.cpp-windows-vulkan.zip"
          ls -la artifact
      - uses: actions/upload-artifact@v4
        with:
          name: whispercpp-vulkan-win32-x86_64
          path: artifact/whispercpp-vulkan-win32-x86_64.zip

  gui:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: engine-dist

      - name: Place engine sidecar + ffmpeg/ffprobe
        shell: bash
        run: |
          mkdir -p gui/src-tauri/binaries
          EXT=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=".exe"; fi
          SIDECAR="gui/src-tauri/binaries/dubflow-engine-${{ matrix.target }}${EXT}"
          FOUND=$(find engine-dist -type f -name "dubflow-engine*" | head -1)
          if [ -n "$FOUND" ]; then
            cp "$FOUND" "$SIDECAR"
          else
            printf '#!/bin/sh\necho dubflow engine placeholder\n' > "$SIDECAR"
            chmod +x "$SIDECAR" || true
          fi
          # ffmpeg/ffprobe 同目录捆绑（引擎 frozen 查找可执行目录）
          for f in $(find engine-dist -type f \( -name "ffmpeg-*" -o -name "ffprobe-*" \) 2>/dev/null); do
            cp "$f" gui/src-tauri/binaries/ || true
          done
          ls -la gui/src-tauri/binaries || true

      - name: Install Linux system deps (tauri v2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Build GUI (vite + tauri)
        working-directory: gui
        run: |
          npm install
          npm run build
          npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.target }}
          path: gui/src-tauri/target/release/bundle/**

  publish:
    needs: [engine, gui, whispercpp]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: whispercpp-vulkan-win32-x86_64
          path: dist

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p release
          find dist -type f \
            \( -name "*.dmg" -o -name "*-setup.exe" -o -name "*.msi" \
               -o -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" \
               -o -name "whispercpp-*.zip" \) \
            -exec cp {} release/ \;
          ls -la release
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "DubFlow $GITHUB_REF_NAME" \
            --generate-notes \
            release/* || gh release upload "$GITHUB_REF_NAME" release/* --clobber
          gh release view "$GITHUB_REF_NAME" --json url,assets
